<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b1b">
<title>404 | EL-sayed Lab</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
padding:20px;
font-family:Cairo,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(ellipse at 50% 40%,#102b60,#050b1b 75%);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background-image:
linear-gradient(#00dfff12 1px,transparent 1px),
linear-gradient(90deg,#00dfff12 1px,transparent 1px);
background-size:40px 40px;
mask-image:linear-gradient(to bottom,#000,transparent);
}

.container{
width:100%;
max-width:700px;
text-align:center;
position:relative;
z-index:1;
}

.badge{
display:inline-block;
padding:8px 20px;
border:1px solid #00dfff66;
border-radius:30px;
color:#83edff;
background:#071c35;
font-size:13px;
letter-spacing:1px;
}

.badge span{color:#00e5ff;font-size:20px}

.scene{
height:245px;
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

.halo{
position:absolute;
width:220px;
height:220px;
border:1px solid #00dfff44;
border-radius:50%;
box-shadow:0 0 60px #008cff33,inset 0 0 40px #008cff22;
animation:pulse 3s infinite;
}

.halo:before{
content:"";
position:absolute;
inset:20px;
border:1px dashed #00dfff66;
border-radius:50%;
}

.flask{
position:relative;
width:120px;
height:175px;
filter:drop-shadow(0 0 20px #00dfff99);
z-index:2;
}

.neck{
position:absolute;
width:32px;
height:60px;
top:0;
left:44px;
border:3px solid #a4f4ff;
border-bottom:0;
border-radius:6px 6px 0 0;
background:#164b7544;
}

.neck:before{
content:"";
position:absolute;
top:-6px;
left:-8px;
width:42px;
height:8px;
border:2px solid #b9f7ff;
border-radius:5px;
background:#164b75;
}

.glass{
position:absolute;
top:48px;
width:120px;
height:125px;
clip-path:polygon(35% 0,65% 0,65% 20%,98% 91%,94% 100%,6% 100%,2% 91%,35% 20%);
background:linear-gradient(90deg,#78eaff88,#d8ffff22,#00bfff55,#74eaff88);
overflow:hidden;
}

.liquid{
position:absolute;
bottom:5px;
left:8px;
right:8px;
height:65px;
background:linear-gradient(180deg,#00e5ff99,#0876ff);
clip-path:polygon(0 12%,100% 0,100% 100%,0 100%);
animation:liquid 3s infinite ease-in-out;
}

.bubble{
position:absolute;
bottom:12px;
width:8px;
height:8px;
border:1px solid white;
border-radius:50%;
animation:bubble 2.5s infinite linear;
}

.b1{left:30px}
.b2{left:65px;animation-delay:.8s}
.b3{left:85px;animation-delay:1.4s}

.bolt{
position:absolute;
color:#a4f8ff;
font-size:40px;
text-shadow:0 0 10px #00dfff,0 0 25px #008cff;
animation:zap 1.5s infinite;
z-index:3;
}

.bolt.one{left:calc(50% - 145px);top:90px}
.bolt.two{right:calc(50% - 145px);top:45px;animation-delay:.6s}
.bolt.three{right:calc(50% - 125px);bottom:25px;animation-delay:1s}

.number{
font-size:clamp(100px,18vw,150px);
font-weight:900;
line-height:1;
letter-spacing:5px;
background:linear-gradient(180deg,#fff,#75eaff 50%,#1674ff);
-webkit-background-clip:text;
color:transparent;
filter:drop-shadow(0 0 15px #008cff77);
}

.number span:nth-child(2){
color:#ffc928;
-webkit-text-fill-color:#ffc928;
filter:drop-shadow(0 0 15px #ffbf36);
}

h1{
font-size:clamp(22px,4vw,32px);
margin:15px 0 8px;
font-weight:900;
}

h1 em{
font-style:normal;
color:#ffc928;
}

p{
color:#a9c7e8;
font-size:14px;
line-height:2;
max-width:500px;
margin:auto;
}

.actions{
margin-top:25px;
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

a{
text-decoration:none;
padding:12px 24px;
border-radius:35px;
font-weight:800;
transition:.3s;
}

.home{
color:#001326;
background:linear-gradient(110deg,#8af5ff,#00cfff,#398cff);
box-shadow:0 0 25px #00cfff66;
}

.back{
color:#b9eaff;
border:1px solid #73dfff66;
background:#071a33;
}

a:hover{transform:translateY(-4px);box-shadow:0 0 30px #00dfff88}

footer{
margin-top:35px;
font-size:11px;
color:#568bb9;
letter-spacing:3px;
}

@keyframes pulse{
50%{transform:scale(1.08);opacity:.6}
}

@keyframes liquid{
50%{height:75px}
}

@keyframes bubble{
0%{transform:translateY(0);opacity:0}
20%{opacity:1}
100%{transform:translateY(-55px);opacity:0}
}

@keyframes zap{
0%,100%{opacity:.3;transform:scale(.8)}
50%{opacity:1;transform:scale(1.2)}
}

@media(max-width:480px){
.scene{height:220px}
.halo{width:190px;height:190px}
.flask{transform:scale(.85)}
p{font-size:13px}
}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important}
}
</style></head><body><main class="container"><div class="badge">
<span>⚛</span>
EL-SAYED CHEMISTRY & PHYSICS LAB
</div><section class="scene"><div class="halo"></div><div class="flask">
<div class="neck"></div>
<div class="glass">
<div class="liquid"></div>
<i class="bubble b1"></i>
<i class="bubble b2"></i>
<i class="bubble b3"></i>
</div>
</div><div class="bolt one">ϟ</div>
<div class="bolt two">ϟ</div>
<div class="bolt three">ϟ</div></section><div class="number">
<span>4</span><span>0</span><span>4</span>
</div><h1>
يبدو أنك دخلت
<em>منطقة غير مكتشفة!</em>
</h1><p>
التفاعل لم يصل إلى النتيجة المطلوبة...
الصفحة التي تبحث عنها غير موجودة أو ربما تم نقلها.
</p><div class="actions">
<a href="/" class="home">⌂ العودة للرئيسية</a>
<a href="javascript:history.back()" class="back">الرجوع للخلف</a>
</div><footer>
CHEMISTRY & PHYSICS LAB
</footer></main></body>
</html>
